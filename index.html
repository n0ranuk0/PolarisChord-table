<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポラリスコード 譜面定数表</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --text-color: #f0f4f8;
      --accent-gold: #ffd700;
      --border-color: #2d3240;

      --diff-easy: #00bfff;
      --diff-normal: #32cd32;
      --diff-hard: #ff8c00;
      --diff-influence: #ff3333;
      --diff-polar: #a020f0;

      /* ジャンルカラー */
      --genre-virtual: #a020f0;
      /* V / 紫 */
      --genre-social: #1e90ff;
      /* ソ / 青 */
      --genre-pops: #ffd700;
      /* ポ / 黄 */
      --genre-touhou: #ff8c00;
      /* 東 / 橙 */
      --genre-variety: #32cd32;
      /* バ / 緑 */
      --genre-original: #00bfff;
      /* オ / 水色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 16px auto;
      background: #161922;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.3rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 1.2rem;
      background: var(--accent-gold);
      border-radius: 3px;
    }

    .btn {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--accent-gold);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #202430;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      word-break: keep-all;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    input[type="range"] {
      cursor: pointer;
    }

    .search-box {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-gold);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    .constant-section {
      margin-bottom: 20px;
    }

    .constant-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      font-size: 0.75rem;
      background: #2b303c;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .song-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .song-card {
      background: var(--card-bg);
      border-radius: 6px;
      padding: 5px;
      border: 1px solid var(--border-color);
      transition: transform 0.1s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .song-card:hover {
      transform: translateY(-2px);
    }

    .jacket-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      overflow: hidden;
      background: #282c37;
      display: flex;
      align-items: center;
      justify-content: center;
      border-style: solid;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .jacket-wrapper.diff-easy {
      border-color: var(--diff-easy);
    }

    .jacket-wrapper.diff-normal {
      border-color: var(--diff-normal);
    }

    .jacket-wrapper.diff-hard {
      border-color: var(--diff-hard);
    }

    .jacket-wrapper.diff-influence {
      border-color: var(--diff-influence);
    }

    .jacket-wrapper.diff-polar {
      border-color: var(--diff-polar);
    }

    .song-jacket {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-jacket {
      font-size: 0.65rem;
      color: #666;
      text-align: center;
      padding: 2px;
    }

    .genre-overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      min-width: 20px;
      height: 15px;
      padding: 0 4px 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.65rem;
      color: #fff;
      border-top-left-radius: 6px;
      clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
      box-shadow: -1px -1px 4px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    .genre-overlay.genre-virtual {
      background-color: var(--genre-virtual);
    }

    .genre-overlay.genre-social {
      background-color: var(--genre-social);
    }

    .genre-overlay.genre-pops {
      background-color: var(--genre-pops);
      color: #000;
    }

    .genre-overlay.genre-touhou {
      background-color: var(--genre-touhou);
    }

    .genre-overlay.genre-variety {
      background-color: var(--genre-variety);
      color: #000;
    }

    .genre-overlay.genre-original {
      background-color: var(--genre-original);
      color: #000;
    }

    .song-title {
      font-weight: bold;
      word-break: break-all;
      line-height: 1.1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .song-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      gap: 2px;
    }

    .diff-badge {
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .diff-badge.diff-easy {
      background-color: var(--diff-easy);
      color: #000;
    }

    .diff-badge.diff-normal {
      background-color: var(--diff-normal);
      color: #000;
    }

    .diff-badge.diff-hard {
      background-color: var(--diff-hard);
    }

    .diff-badge.diff-influence {
      background-color: var(--diff-influence);
    }

    .diff-badge.diff-polar {
      background-color: var(--diff-polar);
    }

    .constant-val {
      color: var(--accent-gold);
      font-weight: bold;
      white-space: nowrap;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      background: var(--card-bg);
      border-radius: 12px;
      color: #8a92a6;
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      padding: 14px 16px;
      background: #161922;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      color: var(--accent-gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #202430;
      padding: 12px;
      border-radius: 8px;
    }

    .filter-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 6px;
    }

    .genre-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px 8px;
    }

    @media (max-width: 600px) {
      .genre-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .range-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .select-input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
    }

    .random-results-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .random-card-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-index-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent-gold);
      background: #202430;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    footer {
      max-width: 1200px;
      margin: 30px auto 16px auto;
      padding: 16px;
      background: #161922;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      color: #8a92a6;
      font-size: 0.75rem;
      line-height: 1.5;
      text-align: center;
    }

    footer p {
      margin-bottom: 4px;
    }

    footer p:last-child {
      margin-bottom: 0;
    }

    .footer-admin-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .footer-admin {
      color: var(--text-color);
      font-weight: bold;
    }

    .btn-small {
      background: #202430;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-small:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
  </style>
</head>

<body>

  <header>
    <div class="header-top">
      <h1>ポラリスコード 譜面定数表</h1>
      <button class="btn" id="open-random-btn">♪ ランダム選曲</button>
    </div>

    <div class="controls">
      <div class="control-row">
        <label class="control-item">
          <input type="checkbox" id="toggle-hard" checked>
          HARDを表示
        </label>
        <label class="control-item">
          <input type="checkbox" id="toggle-normal">
          NORMAL以下を表示
        </label>
      </div>

      <div class="control-row">
        <label class="control-item">
          カード幅:
          <input type="range" id="width-slider" min="50" max="200" value="130">
          <span id="width-value" style="color: var(--accent-gold); font-weight: bold; min-width: 45px;">130px</span>
        </label>
      </div>

      <div class="control-row">
        <input type="text" id="search-input" class="search-box" placeholder="楽曲名で検索...">
      </div>
    </div>
  </header>

  <main id="constant-container">
    <div class="no-data">データを読み込み中...</div>
  </main>

  <!-- ランダム選曲モーダル -->
  <div class="modal-backdrop" id="random-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>♪ ランダム選曲</h2>
        <button class="close-btn" id="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">

        <!-- 選曲数 -->
        <div class="filter-group">
          <div class="filter-title">選曲数</div>
          <div class="range-inputs">
            <select id="rand-count" class="select-input">
              <option value="1">1曲</option>
              <option value="2">2曲</option>
              <option value="3">3曲</option>
              <option value="4">4曲</option>
              <option value="5" selected>5曲</option>
            </select>
          </div>
        </div>

        <!-- 難易度 -->
        <div class="filter-group">
          <div class="filter-title">難易度</div>
          <div class="checkbox-grid">
            <label class="control-item"><input type="checkbox" class="rand-diff" value="EASY"> EASY</label>
            <label class="control-item"><input type="checkbox" class="rand-diff" value="NORMAL"> NORMAL</label>
            <label class="control-item"><input type="checkbox" class="rand-diff" value="HARD" checked> HARD</label>
            <label class="control-item"><input type="checkbox" class="rand-diff" value="INFLUENCE" checked>
              INFLUENCE</label>
            <label class="control-item"><input type="checkbox" class="rand-diff" value="POLAR" checked> POLAR</label>
          </div>
        </div>

        <!-- ジャンル -->
        <div class="filter-group">
          <div class="filter-title">ジャンル</div>
          <div class="genre-grid">
            <label class="control-item"><input type="checkbox" class="rand-genre" value="virtual" checked>
              Virtual</label>
            <label class="control-item"><input type="checkbox" class="rand-genre" value="ソーシャルミュージック" checked>
              ソーシャル<wbr>ミュージック</label>
            <label class="control-item"><input type="checkbox" class="rand-genre" value="pops&アニメ" checked>
              POPS&アニメ</label>
            <label class="control-item"><input type="checkbox" class="rand-genre" value="東方" checked> 東方</label>
            <label class="control-item"><input type="checkbox" class="rand-genre" value="バラエティ" checked> バラエティ</label>
            <label class="control-item"><input type="checkbox" class="rand-genre" value="オリジナル" checked> オリジナル</label>
          </div>
        </div>

        <!-- 譜面定数 範囲 -->
        <div class="filter-group">
          <div class="filter-title">譜面定数 範囲</div>
          <div class="range-inputs">
            <select id="rand-const-min" class="select-input"></select>
            <span>〜</span>
            <select id="rand-const-max" class="select-input"></select>
          </div>
        </div>

        <button class="btn" id="draw-random-btn" style="width: 100%; padding: 10px; font-size: 1rem;">抽選実行</button>

        <div id="random-result-container"></div>

      </div>
    </div>
  </div>

  <footer>
    <p>サイト上の楽曲ジャケット画像の著作権は、全て著作権所持者に帰属します。</p>
    <p>本サイトは非公式のものであり、KONAMI様及びその関連会社とは一切関係ありません。</p>
    <div class="footer-admin-row">
      <span class="footer-admin">サイト管理者 : ちーちゃん</span>
      <button class="btn-small" onclick="document.getElementById('csv-file-input').click()">📂 CSVを選択</button>
      <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
    </div>
  </footer>

  <script>
    let allSongs = [];

    const GENRE_ORDER = [
      "virtual",
      "ソーシャルミュージック",
      "pops&アニメ",
      "東方",
      "バラエティ",
      "オリジナル"
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const slider = document.getElementById("width-slider");
      const widthValSpan = document.getElementById("width-value");

      // スマホ（768px未満）では4曲並ぶ95px、PC等では130pxを初期値にする
      if (window.innerWidth < 768) {
        slider.value = 95;
      } else {
        slider.value = 130;
      }
      // 初期の数値表示を更新
      widthValSpan.textContent = slider.value + "px";

      fetchDataCSV();

      document.getElementById("toggle-hard").addEventListener("change", renderTable);
      document.getElementById("toggle-normal").addEventListener("change", renderTable);

      // スライダー動かすたびに数値テキストを更新して描画
      slider.addEventListener("input", (e) => {
        widthValSpan.textContent = e.target.value + "px";
        renderTable();
      });

      document.getElementById("search-input").addEventListener("input", renderTable);
      document.getElementById("csv-file-input").addEventListener("change", handleFileSelect);

      const modal = document.getElementById("random-modal");
      document.getElementById("open-random-btn").addEventListener("click", () => {
        modal.classList.add("active");
      });
      document.getElementById("close-modal-btn").addEventListener("click", () => {
        modal.classList.remove("active");
      });
      document.getElementById("draw-random-btn").addEventListener("click", drawRandomSongs);
    });

    function updateConstantSelects() {
      const minSelect = document.getElementById("rand-const-min");
      const maxSelect = document.getElementById("rand-const-max");
      minSelect.innerHTML = "";
      maxSelect.innerHTML = "";

      if (allSongs.length === 0) {
        const opt = document.createElement("option");
        opt.value = "1.0";
        opt.textContent = "1.0";
        minSelect.appendChild(opt);
        maxSelect.appendChild(opt.cloneNode(true));
        return;
      }

      const constants = allSongs.map(s => s.constant);
      const minVal = Math.min(...constants);
      const maxVal = Math.max(...constants);

      const minKey = Math.floor(Math.round(minVal * 10));
      const maxKey = Math.ceil(Math.round(maxVal * 10));

      for (let i = minKey; i <= maxKey; i++) {
        const val = (i / 10).toFixed(1);

        const optMin = document.createElement("option");
        optMin.value = val;
        optMin.textContent = val;
        minSelect.appendChild(optMin);

        const optMax = document.createElement("option");
        optMax.value = val;
        optMax.textContent = val;
        maxSelect.appendChild(optMax);
      }

      minSelect.value = (minKey / 10).toFixed(1);
      maxSelect.value = (maxKey / 10).toFixed(1);
    }

    async function fetchDataCSV() {
      try {
        const res = await fetch("data.csv");
        if (!res.ok) throw new Error("CSV not found");
        const text = await res.text();
        parseCSV(text);
      } catch (err) {
        document.getElementById("constant-container").innerHTML = `
          <div class="no-data">
            data.csv が見つかりませんでした。<br>
            「data.csv」をindex.htmlと同じフォルダに配置するか、フッターの「CSVを選択」から読み込んでください。
          </div>`;
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        parseCSV(evt.target.result);
      };
      reader.readAsText(file);
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length <= 1) {
        document.getElementById("constant-container").innerHTML = '<div class="no-data">有効なデータが見つかりませんでした。</div>';
        return;
      }

      allSongs = [];
      for (let i = 1; i < lines.length; i++) {
        const row = parseCSVLine(lines[i]);
        if (row.length >= 3) {
          const title = row[0]?.trim() || "";
          const genre = row[1]?.trim() || "";
          const constant = parseFloat(row[2]);
          const difficulty = row[3]?.trim() || "POLAR";
          const releaseDateRaw = row[4]?.trim() || "";
          const jacket = row[5]?.trim() || "";

          let releaseDate = new Date("9999-12-31");
          if (releaseDateRaw) {
            const formatted = releaseDateRaw.replace(/\//g, "-");
            const parsed = Date.parse(formatted);
            if (!isNaN(parsed)) {
              releaseDate = new Date(parsed);
            }
          }

          if (title && !isNaN(constant)) {
            allSongs.push({
              title,
              genre,
              constant,
              difficulty,
              releaseDateRaw,
              releaseDate,
              jacket
            });
          }
        }
      }

      updateConstantSelects();
      renderTable();
    }

    function parseCSVLine(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cell);
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell);
      return result;
    }

    function getGenreInfo(genreStr) {
      const g = genreStr.toLowerCase();
      if (g.includes("virtual")) {
        return { label: "V", className: "genre-virtual" };
      } else if (g.includes("ソーシャル")) {
        return { label: "ソ", className: "genre-social" };
      } else if (g.includes("pops") || g.includes("アニメ")) {
        return { label: "ポ", className: "genre-pops" };
      } else if (g.includes("東方")) {
        return { label: "東", className: "genre-touhou" };
      } else if (g.includes("バラエティ")) {
        return { label: "バ", className: "genre-variety" };
      } else if (g.includes("オリジナル")) {
        return { label: "オ", className: "genre-original" };
      }
      return { label: genreStr.charAt(0) || "他", className: "genre-original" };
    }

    function renderTable() {
      const container = document.getElementById("constant-container");
      const showHard = document.getElementById("toggle-hard").checked;
      const showNormal = document.getElementById("toggle-normal").checked;
      const cardWidthPx = parseInt(document.getElementById("width-slider").value, 10);
      const cardWidth = cardWidthPx + "px";
      const searchText = document.getElementById("search-input").value.toLowerCase();

      container.innerHTML = "";

      const filtered = allSongs.filter(song => {
        const diffUpper = song.difficulty.toUpperCase();
        if (!showHard && diffUpper === "HARD") return false;
        if (!showNormal && (diffUpper === "NORMAL" || diffUpper === "EASY")) return false;
        if (searchText && !song.title.toLowerCase().includes(searchText)) return false;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-data">該当する楽曲がありません。</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(song => {
        const key = song.constant.toFixed(1);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(song);
      });

      const sortedKeys = Object.keys(grouped).sort((a, b) => parseFloat(b) - parseFloat(a));

      sortedKeys.forEach(key => {
        grouped[key].sort((a, b) => {
          if (a.releaseDate.getTime() !== b.releaseDate.getTime()) {
            return a.releaseDate.getTime() - b.releaseDate.getTime();
          }

          const gIndexA = GENRE_ORDER.indexOf(a.genre.toLowerCase());
          const gIndexB = GENRE_ORDER.indexOf(b.genre.toLowerCase());
          const orderA = gIndexA !== -1 ? gIndexA : 99;
          const orderB = gIndexB !== -1 ? gIndexB : 99;

          if (orderA !== orderB) {
            return orderA - orderB;
          }

          return a.title.localeCompare(b.title, "ja");
        });

        const section = document.createElement("div");
        section.className = "constant-section";

        const header = document.createElement("div");
        header.className = "constant-header";
        header.innerHTML = `<span>${key}</span> <span class="count-badge">${grouped[key].length}曲</span>`;
        section.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "song-grid";

        grouped[key].forEach(song => {
          const card = createSongCard(song, cardWidth, cardWidthPx);
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function createSongCard(song, widthStyle, widthPx = 160) {
      const card = document.createElement("div");
      const diffKey = song.difficulty.toLowerCase();
      const diffClass = `diff-${diffKey}`;
      const genreInfo = getGenreInfo(song.genre);

      card.className = "song-card";
      if (widthStyle) card.style.width = widthStyle;

      const jacketHtml = song.jacket
        ? `<img class="song-jacket" src="${escapeHTML(song.jacket)}" alt="jacket" onerror="this.parentNode.innerHTML='<span class=no-jacket>No Image</span>'">`
        : `<span class="no-jacket">No Image</span>`;

      // 幅に応じた文字サイズと枠線太さの計算
      const titleFontSize = Math.max(0.6, Math.min(0.85, widthPx / 150)) + "rem";
      const metaFontSize = Math.max(0.55, Math.min(0.75, widthPx / 170)) + "rem";
      const borderWidth = Math.max(2, Math.round(widthPx / 35)) + "px";

      // 難易度名の短縮（幅が狭い場合）
      let diffLabel = song.difficulty;
      if (widthPx < 110) {
        if (diffLabel === "INFLUENCE") diffLabel = "INF";
        else if (diffLabel === "NORMAL") diffLabel = "NOR";
        else if (diffLabel === "POLAR") diffLabel = "POL";
      }

      // 幅が80px未満の場合はジャケットのみの超コンパクト表示
      const showText = widthPx >= 80;

      card.innerHTML = `
        <div class="jacket-wrapper ${diffClass}" style="border-width: ${borderWidth};">
          ${jacketHtml}
          <div class="genre-overlay ${genreInfo.className}">${escapeHTML(genreInfo.label)}</div>
        </div>
        ${showText ? `
          <div class="song-title" style="font-size: ${titleFontSize};">${escapeHTML(song.title)}</div>
          <div class="song-meta" style="font-size: ${metaFontSize};">
            <span class="diff-badge ${diffClass}">${escapeHTML(diffLabel)}</span>
            <span class="constant-val">${song.constant.toFixed(1)}</span>
          </div>
        ` : ''}
      `;
      return card;
    }

    function drawRandomSongs() {
      const count = parseInt(document.getElementById("rand-count").value, 10);
      const selectedDiffs = Array.from(document.querySelectorAll(".rand-diff:checked")).map(el => el.value.toUpperCase());
      const selectedGenres = Array.from(document.querySelectorAll(".rand-genre:checked")).map(el => el.value.toLowerCase());
      const minConst = parseFloat(document.getElementById("rand-const-min").value);
      const maxConst = parseFloat(document.getElementById("rand-const-max").value);

      const pool = allSongs.filter(s => {
        if (!selectedDiffs.includes(s.difficulty.toUpperCase())) return false;

        const songGenreLower = s.genre.toLowerCase();
        const matchesGenre = selectedGenres.some(g => songGenreLower.includes(g));
        if (!matchesGenre) return false;

        if (s.constant < minConst || s.constant > maxConst) return false;

        return true;
      });

      const resultContainer = document.getElementById("random-result-container");
      resultContainer.innerHTML = "";

      if (pool.length === 0) {
        resultContainer.innerHTML = '<div class="no-data">条件に合う楽曲がありませんでした。</div>';
        return;
      }

      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      const selected = shuffled.slice(0, Math.min(count, pool.length));

      const grid = document.createElement("div");
      grid.className = "random-results-grid";

      selected.forEach((song, idx) => {
        const wrapper = document.createElement("div");
        wrapper.className = "random-card-wrapper";

        const label = document.createElement("div");
        label.className = "song-index-label";
        label.textContent = `${idx + 1}曲目`;

        const card = createSongCard(song, "100px", 100);

        wrapper.appendChild(label);
        wrapper.appendChild(card);
        grid.appendChild(wrapper);
      });

      resultContainer.appendChild(grid);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
